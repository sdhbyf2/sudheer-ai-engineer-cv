<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><title>Portfolio sharing card</title>
<style>
@font-face { font-family: 'DM Sans'; src: url('/fonts/dm-sans-latin.woff2') format('woff2'); font-weight: 400 700; }
* { box-sizing: border-box; }
html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
body { background: #0c100e; color: #edeae2; font-family: 'DM Sans', sans-serif; }
.card { position: relative; width: 1200px; height: 630px; padding: 48px 64px; }
.rule { position: absolute; left: 64px; right: 64px; top: 48px; height: 1px; background: #c9b58d55; }
.eyebrow { margin: 42px 0 28px; color: #c9b58d; letter-spacing: 3px; font-size: 18px; font-weight: 500; }
h1 { font-size: 76px; line-height: 1.08; letter-spacing: -4px; font-weight: 400; margin: 0 0 26px; }
h1 span { color: #d7c49d; font-family: Georgia, serif; font-style: italic; letter-spacing: -3px; }
.statement { color: #bcc5b5; font-size: 24px; line-height: 1.5; margin: 0; }
.skills { margin-top: 32px; font-size: 16px; letter-spacing: .6px; color: #dfcea6; }
.url { position: absolute; left: 64px; bottom: 47px; margin: 0; font-size: 18px; color: #a9b5a0; }
.photo { position: absolute; right: 68px; top: 95px; width: 362px; height: 443px; background: #c9b58d; clip-path: polygon(9% 0,94% 0,100% 6%,100% 89%,88% 100%,0 100%,0 8%); padding: 2px; }
.photo img { width: 100%; height: 100%; object-fit: cover; object-position: 52% 50%; clip-path: polygon(9% 0,94% 0,100% 6%,100% 89%,88% 100%,0 100%,0 8%); }
.frame { position: absolute; right: 47px; top: 77px; width: 403px; height: 479px; border: 1px solid #74826066; clip-path: polygon(9% 0,94% 0,100% 6%,100% 89%,88% 100%,0 100%,0 8%); }
.signature { position: absolute; right: 74px; bottom: 44px; color: #c9b58d; font-size: 16px; }
</style></head><body><main class="card">
<div class="rule"></div><p class="eyebrow">AI ENGINEER · FULL-STACK BUILDER</p>
<h1>Sudheer<br/><span>Palakurla.</span></h1>
<p class="statement">A human perspective.<br/>An engineering mindset.</p>
<p class="skills">RAG &nbsp; / &nbsp; REAL-TIME VOICE &nbsp; / &nbsp; FULL-STACK</p>
<div class="frame"></div><div class="photo"><img src="/portrait-960.webp" alt="Sudheer Palakurla"/></div>
<p class="url">sudheercv.vercel.app</p><span class="signature">From architecture to deployment.</span>
</main></body></html>
